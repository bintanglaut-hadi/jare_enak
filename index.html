<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Kasir Jare Enak</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        .app-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }

        /* Tampilan HP */
        @media screen and (max-width: 768px) {

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            .app-container {
                width: 100vw;
                height: 100dvh;
            }

            iframe {
                width: 100vw;
                height: 100dvh;
            }
        }
    </style>
</head>

<body>

    <div class="app-container">
        <iframe
            src="https://script.google.com/macros/s/AKfycbz1CTsSEpdMfr9OtdqvIJlY1uVWlP5uxjFnqT1QKZpMXeTte23wHRYtG4sJidyz682wdA/exec"
            allow="clipboard-read; clipboard-write"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
